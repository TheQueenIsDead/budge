name: PR

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # Tests and builds the image a release would publish, without pushing it.
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml

  # The image a release would publish, in a browser.
  e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/_e2e.yml

  # Known vulnerabilities in what the image is built from.
  vulns:
    permissions:
      contents: read
    uses: ./.github/workflows/_vulns.yml

  lint:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
      # The linter builds the code, which embeds the page's libraries.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: web/package.json
      - name: Install the page's libraries
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          install-mode: goinstall
          # A pinned version, so a new linter's new checks arrive in a
          # Renovate PR rather than failing whatever PR runs next.
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0
          # The browser tests are built only with the e2e tag.
          args: --build-tags e2e
