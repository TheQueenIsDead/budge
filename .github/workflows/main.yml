# On push to main, test main in a browser, then aggregate a release PR.
# If the release PR is merged and a tag created, a new image will be pushed to GHCR.
name: Main

on:
  push:
    branches: [ "main" ]

jobs:
  # Every push to main, in a browser. Release Please waits on it, so the
  # release PR only takes in commits that pass, and a release, with its tag,
  # is only made once its own commit has passed too.
  e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/_e2e.yml

  # Run release-please to aggregate changes and handle semantic versioning via conventional commits
  release:
    needs: e2e
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: googleapis/release-please-action@v5

  # Publish (only if a new release was created), tested and built the same
  # way as on a PR.
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      push: true
      tag: ${{ needs.release.outputs.tag_name }}
