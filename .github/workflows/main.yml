# On push to main, aggregate a release PR.
# If the release PR is merged and a tag created, a new image will be pushed to GHCR.
name: Main

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: googleapis/release-please-action@v5

  # A new release's image in a browser, before it is published.
  e2e:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      contents: read
    uses: ./.github/workflows/_e2e.yml

  # Publish (only if a new release was created and its browser tests pass),
  # tested and built the same way as on a PR.
  build:
    needs: [release, e2e]
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      push: true
      tag: ${{ needs.release.outputs.tag_name }}
