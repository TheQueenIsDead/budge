# On push to main, aggregate a release PR.
# If the release PR is merged and a tag created, a new image will be pushed to GHCR.
name: Main

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      # Release
      - uses: actions/checkout@v7
      - id: release
        uses: googleapis/release-please-action@v5

      # Publish (only if a new release was created)
      - if: ${{ steps.release.outputs.release_created }}
        uses: docker/setup-buildx-action@v4

      - if: ${{ steps.release.outputs.release_created }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image builds with the Go go.mod names and installs the page's
      # libraries with the pnpm web/package.json names, so the build asks setup
      # for each and passes their versions.
      - if: ${{ steps.release.outputs.release_created }}
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - if: ${{ steps.release.outputs.release_created }}
        id: pnpm
        run: echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.release.outputs.release_created }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # This workflow runs on refs/heads/main, not on the release tag, so
          # semver patterns must read the version from the release-please output
          # rather than the git ref.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag_name }}
            type=raw,value=latest,enable={{is_default_branch}}

      - if: ${{ steps.release.outputs.release_created }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GO_VERSION=${{ steps.go.outputs.go-version }}
            PNPM_VERSION=${{ steps.pnpm.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
