# Tests budge, builds its image and tests that in a browser, the same way for a
# PR and a release, so a PR proves the image a release will publish. Only a
# release pushes it to GHCR.
name: _build

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to GHCR.
        type: boolean
        default: false
      tag:
        description: The release tag, such as v1.2.3, which names the image's version.
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile builds with the Go go.mod names and the pnpm
      # web/package.json names, read here to pass in as build args.
      - id: versions
        run: |
          echo "go=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r '.packageManager | ltrimstr("pnpm@") | split("+")[0]' web/package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A release runs on refs/heads/main, not on the release tag, so semver
          # patterns must read the version from the tag input rather than the
          # git ref. A PR has no tag, and is named after its number.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
            type=ref,event=pr

      # The Dockerfile's test stage runs the tests on the code the image is
      # built from, sharing its modules, libraries and cache.
      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          build-args: |
            GO_VERSION=${{ steps.versions.outputs.go }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
          cache-from: type=gha

      # Built into the runner's Docker, for the browser tests to run, and
      # pushed from there as it is, so a release pushes the image tested.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            budge:e2e
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GO_VERSION=${{ steps.versions.outputs.go }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The image in a browser, on made-up data; see e2e/.
      - name: Browser tests
        env:
          BUDGE_E2E_IMAGE: budge:e2e
        run: go test -tags e2e -artifacts -outputdir "$RUNNER_TEMP/e2e" ./e2e/...

      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests
          path: ${{ runner.temp }}/e2e/_artifacts
          if-no-files-found: ignore

      - if: ${{ inputs.push }}
        name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
