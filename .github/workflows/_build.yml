# Tests budge and builds its image, the same way for a PR and a release, so a PR
# proves the image a release will publish. Only a release pushes it to GHCR.
name: _build

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to GHCR.
        type: boolean
        default: false
      tag:
        description: The release tag, such as v1.2.3, which names the image's version.
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Dockerfile builds with the Go go.mod names and the pnpm
      # web/package.json names, read here to pass in as build args, along
      # with the image's name in the lowercase registries need.
      - id: versions
        run: |
          echo "go=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r '.packageManager | ltrimstr("pnpm@") | split("+")[0]' web/package.json)" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A release runs on refs/heads/main, not on the release tag, so semver
          # patterns must read the version from the tag input rather than the
          # git ref. A PR has no tag, and is named after its number.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=pr

      # The Dockerfile's test stage runs the tests on the code the image is
      # built from, sharing its modules, libraries and cache.
      - name: Test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: test
          build-args: |
            GO_VERSION=${{ steps.versions.outputs.go }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
          cache-from: type=gha

      # With an SBOM of what is in it, and how, from what, it was built,
      # attached to the image for scanners and `docker buildx imagetools
      # inspect` to read.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
            GO_VERSION=${{ steps.versions.outputs.go }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A signed statement, kept in GitHub and pushed next to the image, that
      # this workflow built the image from this commit, for anyone to check
      # with `gh attestation verify oci://ghcr.io/thequeenisdead/budge:<tag>
      # --repo TheQueenIsDead/budge`. Given no predicate, actions/attest makes
      # it SLSA build provenance. The image's name must be lowercase.
      - if: ${{ inputs.push }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.versions.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
